<template>
   <!-- Modal -->
   <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open main">
      <div class="container">
         <!-- Modal/Title Bar -->
         <header class="header">
            <p>Select Users to Share Note</p>
            <button class="btn" onclick={closeModal} title="Close">
               <lightning-icon icon-name="utility:close" alternative-text="close" size="x-small"></lightning-icon>
            </button>
         </header>

         <div class="slds-p-top_small">
            <template for:each={users} for:item=user>
               <div key={user.Id} class="slds-grid slds-grid_vertical-align-center user-item">
                  <lightning-input type="checkbox" label={user.Name} value={user.Id}
                     onchange={handleCheckboxChange}></lightning-input>
               </div>
            </template>
         </div>

         <footer class="footer">
            <lightning-button variant="brand" label="Share" disabled={isDisabled}
               onclick={shareNote}></lightning-button>
         </footer>
      </div>
      <template if:true={isLoading}>
         <lightning-spinner size="small" variant="brand"></lightning-spinner>
      </template>
   </section>
   <div class="slds-backdrop slds-backdrop_open"></div>
</template>
