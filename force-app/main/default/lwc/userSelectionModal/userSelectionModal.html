<template>
   <!-- Modal -->
   <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open main">
      <div class="container">
         <!-- Modal/Title Bar -->
         <header class="header">
            <p>Select Users to Share Note</p>
            <button class="btn" onclick={closeModal} title="Close">
               <lightning-icon icon-name="utility:close" alternative-text="close" size="x-small"></lightning-icon>
            </button>
         </header>

         <div class="sub-container">
            <div class="slds-p-top_small">
               <template if:false={users.length}>
                  <p>No users found</p>
               </template>
               <template for:each={users} for:item=user>
                  <div key={user.Id} class="slds-grid slds-grid_vertical-align-center user-item">
                     <lightning-input type="checkbox" label={user.Name} value={user.Id}
                        onchange={handleCheckboxChange}></lightning-input>
                  </div>
               </template>
            </div>
         </div>


         <footer class="footer">


            <div class="slds-p-top_xx-small slds-p-bottom_small" style="display: flex;">
               <lightning-input class="custom-label" type="checkbox" label="Send Notification"
                  checked={sendNotification} onchange={handleSendNotificationChange}></lightning-input>
               <lightning-input class="custom-label" style="font-size: 12px;" type="checkbox" label="Send Email"
                  checked={sendEmail} onchange={handleSendEmailChange}></lightning-input>
            </div>
            <!-- 
            <div style="padding-top: 2px; padding-bottom: 8px; display: flex; justify-content: center; width: 100%;">
               <label style="font-size: 14px; margin-right: 10px;" class="custom-label">
                  <input type="checkbox" checked={sendNotification} onchange={handleSendNotificationChange}>
                  Send Notification
               </label>
               <label style="font-size: 12px; margin-left: 20px;" class="custom-label">
                  <input type="checkbox" checked={sendEmail} onchange={handleSendEmailChange}>
                  Send Email
               </label>
            </div> -->


            <lightning-button variant="brand" label="Share" disabled={isDisabled}
               onclick={shareNote}></lightning-button>
         </footer>
      </div>
      <template if:true={isLoading}>
         <lightning-spinner size="small" variant="brand"></lightning-spinner>
      </template>
   </section>
   <div class="slds-backdrop slds-backdrop_open"></div>
</template>
